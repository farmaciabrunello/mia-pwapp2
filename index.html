<!DOCTYPE html>
<html lang="it">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Farmacia Brunello">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#ffffff">

    <!-- Icone iOS Home Screen -->
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <link rel="apple-touch-icon-precomposed" sizes="180x180" href="icons/apple-touch-icon.png">

    <!-- Favicon standard e SVG -->
    <link rel="icon" type="image/png" sizes="96x96" href="icons/favicon-96x96.png">
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
    <link rel="shortcut icon" href="icons/favicon.ico">

    <!-- Collegamento al Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <title>Farmacia Brunello</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- OneSignal Web SDK v16 -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "7baa9639-10e1-4357-bfa8-6ab1b6c4c688",
          serviceWorkerPath: "OneSignalSDKWorker.js",
          serviceWorkerParam: { scope: "/app/" }
        });
      });
    </script>
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>
    
<header class="main-header">
    <div class="header-content">
        <div class="logo">
            <a href="index.html" title="Torna alla Home">
                <img src="assets/vectors/logo-farmacia.svg" alt="Farmacia Brunello" class="logo-image">
            </a>
        </div>
      <div class="header-icons">
    <a href="https://wa.me/390422491591" class="header-btn" target="_blank">
        <div class="icon-wrapper">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path fill="currentColor" d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.185-.573c.948.517 2.011.888 3.146.889h.001c3.182 0 5.767-2.587 5.768-5.766 0-3.18-2.586-5.765-5.769-5.765zm3.425 8.311c-.14.397-.714.726-1.12.776-.364.045-.838.077-2.396-.548-1.992-.799-3.273-2.822-3.372-2.955-.1-.133-.815-1.082-.815-2.064s.508-1.467.689-1.666c.181-.199.395-.249.526-.249s.263.003.378.009c.124.006.29-.047.454.346.164.397.562 1.37.611 1.47.049.1.082.215.017.348-.066.133-.099.215-.198.331-.099.115-.208.258-.296.353-.099.108-.202.226-.087.424.115.197.511.844 1.093 1.362.749.667 1.381.874 1.578.973.197.1.312.083.427-.049.115-.133.493-.573.624-.769.131-.197.263-.166.444-.1s1.15.542 1.347.641c.197.1.329.15.378.233.05.083.05.481-.09.878z"/>
            </svg>
        </div>
        <span class="header-btn-label">WHATSAPP</span>
    </a>

    <a href="tel:+390422491591" class="header-btn">
        <div class="icon-wrapper">
            <span class="material-symbols-outlined">call</span>
        </div>
        <span class="header-btn-label">CHIAMA</span>
    </a>
</div>
    </div>
</header>
    
<main class="scrollable-content">
    <div id="home-content">
        <section class="section notification-panel">
            <div style="background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center;">
                <h3 style="margin-bottom: 10px; font-size: 1rem;">Resta aggiornato</h3>
                <div id="loading-status" style="font-size: 0.9rem; color: #666;">Verifica stato...</div>
                
                <button id="subscribe-btn" onclick="gestisciIscrizione()" class="btn btn-subscribe" style="display:none; cursor: pointer; padding: 10px 15px; margin: 10px auto; background-color: #28a745; color: white; border: none; border-radius: 8px; font-weight: bold;">
                    🔔 Attiva Notifiche
                </button>
                
                <button id="unsubscribe-btn" onclick="gestisciDisiscrizione()" class="btn btn-unsubscribe" style="display:none; cursor: pointer; padding: 10px 15px; margin: 10px auto; background-color: #dc3545; color: white; border: none; border-radius: 8px; font-weight: bold;">
                    🔕 Disattiva Notifiche
                </button>
            </div>
        </section>

        <section class="events-section">
            <div class="section-header">
                <h2>Prossimi Eventi</h2>
                <span class="view-all">Vedi tutti</span>
            </div>
            <div class="events-container" id="events-list">
                <div class="event-card">Caricamento eventi...</div>
            </div>
        </section>
    </div>

    <section id="turni-section" class="section" style="display:none; padding: 0 20px;">
        <div class="section-header">
            <h2>Turni Farmacia</h2>
        </div>
        
        <div id="turno-attuale-container">
            <p style="font-size: 0.9rem; margin-bottom: 10px; color: #666;">Turno in corso:</p>
            <div class="shift-card-main">
                <img id="img-turno-attuale" src="" class="zoomable-img" alt="Turno Attuale">
            </div>
        </div>

        <div id="altri-turni" style="margin-top: 25px;">
            <p style="font-size: 0.8rem; font-weight: bold; color: var(--ios-grey); text-transform: uppercase;">Altre settimane</p>
            <div class="events-container" id="lista-altri-turni" style="padding: 10px 0;">
                </div>
        </div>
    </section>

    <div id="zoom-modal" class="modal">
        <span class="close-modal">&times;</span>
        <img class="modal-content" id="img-zoomato">
    </div>
</main>

<footer class="main-nav">
    <div class="nav-item active">
        <span class="material-symbols-outlined nav-icon">home</span>
        <span class="nav-label">HOME</span>
    </div>
    <div class="nav-item">
        <span class="material-symbols-outlined nav-icon">calendar_month</span>
        <span class="nav-label">PRENOTA</span>
    </div>
    <div class="nav-item">
        <span class="material-symbols-outlined nav-icon">schedule</span>
        <span class="nav-label">TURNI</span>
    </div>
    <div class="nav-item">
        <span class="material-symbols-outlined nav-icon">settings</span>
        <span class="nav-label">IMPOSTAZIONI</span>
    </div>
</footer>

<script>
    // 1. Logica OneSignal
    window.OneSignalDeferred = window.OneSignalDeferred || [];

    async function updateButtons() {
        OneSignalDeferred.push(async function(OneSignal) {
            try {
                const isOptedIn = OneSignal.User.PushSubscription.optedIn;
                const permission = OneSignal.Notifications.permission;
                
                const statusElem = document.getElementById('loading-status');
                const subBtn = document.getElementById('subscribe-btn');
                const unsubBtn = document.getElementById('unsubscribe-btn');

                if (statusElem) statusElem.style.display = 'none';

                // Se l'utente è iscritto ED ha dato il permesso al browser
                if (isOptedIn && permission) {
                    if (subBtn) subBtn.style.display = 'none';
                    if (unsubBtn) unsubBtn.style.display = 'block';
                } else {
                    if (subBtn) subBtn.style.display = 'block';
                    if (unsubBtn) unsubBtn.style.display = 'none';
                }
            } catch (err) {
                console.error("Errore durante l'aggiornamento dei pulsanti:", err);
            }
        });
    }

    // Registra i listener per OneSignal
    OneSignalDeferred.push(function(OneSignal) {
        updateButtons();
        
        // Ascolta il cambio di stato dell'iscrizione
        OneSignal.User.PushSubscription.addEventListener("change", updateButtons);
        
        // Ascolta il cambio di permessi della notifica
        OneSignal.Notifications.addEventListener("permissionChange", updateButtons);
    });

    async function gestisciIscrizione() {
        OneSignalDeferred.push(async function(OneSignal) {
            try {
                // Controllo specifico per Safari su iOS
                const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
                const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;

                if (isIOS && !isStandalone) {
                    alert("Per attivare le notifiche su iPhone, prima aggiungi questa app alla schermata Home (premi il tasto Condividi e seleziona 'Aggiungi a Schermata Home').");
                    return;
                }

                const permission = await OneSignal.Notifications.requestPermission();
                if (permission) {
                    await OneSignal.User.PushSubscription.optIn();
                    await updateButtons();
                } else {
                    alert("Le notifiche sono state bloccate. Puoi abilitarle dalle impostazioni del tuo dispositivo/browser.");
                }
            } catch (err) {
                console.error("Errore nell'attivazione:", err);
            }
        });
    }

    async function gestisciDisiscrizione() {
        OneSignalDeferred.push(async function(OneSignal) {
            try {
                await OneSignal.User.PushSubscription.optOut();
                await updateButtons();
            } catch (err) {
                console.error("Errore nella disattivazione:", err);
            }
        });
    }

    // 2. Navigazione tra sezioni
    const navItems = document.querySelectorAll('.nav-item');
    navItems.forEach(item => {
        item.addEventListener('click', function() {
            navItems.forEach(nav => nav.classList.remove('active'));
            this.classList.add('active');

            const label = this.querySelector('.nav-label').innerText;
            const homeContent = document.getElementById('home-content');
            const turniSection = document.getElementById('turni-section');

            if (label === 'TURNI') {
                homeContent.style.display = 'none';
                turniSection.style.display = 'block';
                loadTurni();
            } else if (label === 'HOME') {
                homeContent.style.display = 'block';
                turniSection.style.display = 'none';
                loadEvents();
            }
        });
    });

    // 3. Caricamento Eventi
    async function loadEvents() {
        const eventsList = document.getElementById('events-list');
        const API_URL = 'https://sheetdb.io/api/v1/mcvst24hmpts3?sheet=Eventi';
        const DEFAULT_IMAGE = 'https://images.unsplash.com/photo-1586015555751-63bb77f4322a?q=80&w=1000&auto=format&fit=crop';

        try {
            const response = await fetch(API_URL);
            const data = await response.json();
            eventsList.innerHTML = ''; 

            if (!data || data.length === 0) {
                eventsList.innerHTML = '<div class="event-card"><div class="event-info">Nessun evento in programma.</div></div>';
                return;
            }

            data.forEach(event => {
                const imgUrl = (event.immagine && event.immagine.trim() !== "") ? event.immagine : DEFAULT_IMAGE;
                eventsList.innerHTML += `
                    <div class="event-card">
                        <img src="${imgUrl}" class="event-image" alt="${event.titolo}" onerror="this.src='${DEFAULT_IMAGE}';">
                        <div class="event-info">
                            <span class="event-date">${event.data || 'Prossimamente'}</span>
                            <h4 class="event-title">${event.titolo || 'Nuovo Evento'}</h4>
                        </div>
                    </div>`;
            });
        } catch (error) {
            eventsList.innerHTML = '<div class="event-card"><div class="event-info">Errore di caricamento.</div></div>';
        }
    }

    // 4. Caricamento Turni
    async function loadTurni() {
        const API_URL_TURNI = 'https://sheetdb.io/api/v1/mcvst24hmpts3?sheet=Turni'; 
        const today = new Date();
        
        try {
            const response = await fetch(API_URL_TURNI);
            const data = await response.json();
            const containerAttuale = document.getElementById('img-turno-attuale');
            const listaAltri = document.getElementById('lista-altri-turni');
            listaAltri.innerHTML = '';

            data.forEach((turno, index) => {
                const inizio = new Date(turno.inizio);
                const fine = new Date(turno.fine);
                
                if (today >= inizio && today < fine) {
                    containerAttuale.src = turno.immagine;
                    if(data[index-1]) aggiungiMiniatura(data[index-1], "Sett. Precedente");
                    if(data[index+1]) aggiungiMiniatura(data[index+1], "Sett. Successiva");
                }
            });
        } catch (e) { console.error("Errore turni", e); }
    }

    function aggiungiMiniatura(turno, label) {
        const div = document.createElement('div');
        div.className = 'event-card';
        div.style.flex = '0 0 140px';
        div.innerHTML = `
            <img src="${turno.immagine}" class="event-image" style="height:100px; object-fit: cover;">
            <div class="event-info"><span class="event-date">${label}</span></div>`;
        div.onclick = () => aprireZoom(turno.immagine);
        document.getElementById('lista-altri-turni').appendChild(div);
    }

    // 5. Zoom Immagini
    const modal = document.getElementById("zoom-modal");
    const imgZoomato = document.getElementById("img-zoomato");

    document.getElementById('img-turno-attuale').onclick = function() { aprireZoom(this.src); };

    function aprireZoom(src) {
        if(!src) return;
        modal.style.display = "block";
        imgZoomato.src = src;
    }

    document.querySelector(".close-modal").onclick = () => modal.style.display = "none";
    window.onclick = (event) => { if (event.target == modal) modal.style.display = "none"; };

    // Init
    loadEvents();
</script>

</body>
</html>
